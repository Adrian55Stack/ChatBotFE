<mat-accordion>
    <mat-expansion-panel disabled expanded class="mx-3 chat-content-panel">
        @for(message of (messages | async); track message?.id) {
            <app-message [message]="message"></app-message>
        } @empty {
            <app-empty-list></app-empty-list>
        }
        @if(botIsTyping | async) {
            <app-typing-in-progress></app-typing-in-progress>
        }
    </mat-expansion-panel>
</mat-accordion>
